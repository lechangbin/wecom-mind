        code: "import json\nimport re\n\ndef _parse(text):\n    if not isinstance(text, str):\n        return None, \"模型输出不是字符串\"\
          \n    raw = text.strip()\n    if raw.startswith(\"```\"):\n        raw = re.sub(r\"^```(?:json)?\\s*\", \"\", raw)\n\
          \        raw = re.sub(r\"\\s*```$\", \"\", raw)\n    try:\n        return json.loads(raw), \"\"\n    except Exception\
          \ as first_error:\n        match = re.search(r\"\\{.*\\}\", raw, re.S)\n        if not match:\n            return\
          \ None, f\"未找到 JSON 对象：{first_error}\"\n        try:\n            return json.loads(match.group(0)), \"\"\n    \
          \    except Exception as second_error:\n            return None, f\"JSON 解析失败：{second_error}\"\n\ndef _num(value):\n\
          \    if isinstance(value, bool):\n        return None\n    try:\n        number = float(value)\n    except Exception:\n\
          \        return None\n    return max(0.0, min(1.0, number))\n\ndef _list(value):\n    return value if isinstance(value,\
          \ list) else []\n\ndef _invalid(reason, userid, conversation_no, retry_template):\n    return {\n        \"userid\"\
          : userid,\n        \"profile_action\": \"no_change\",\n        \"updated_profile\": {\"summary\": \"\", \"facts\"\
          : []},\n        \"changes\": {\"facts_added\": [], \"facts_updated\": [], \"facts_retired\": []},\n        \"evidence\"\
          : {\"conversation_no\": conversation_no, \"msgids\": []},\n        \"confidence\": 0.0,\n        \"is_valid\": False,\n\
          \        \"error_reason\": reason,\n        \"retry_template\": retry_template,\n        \"raw_output\": \"\",\n\
          \    }\n\ndef _check_msgids(values, allowed, field, retry_template, userid, conversation_no):\n    if not isinstance(values,\
          \ list):\n        return f\"{field} 必须是数组\"\n    for msgid in values:\n        if not isinstance(msgid, str) or\
          \ msgid not in allowed:\n            return f\"{field} 包含输入中不存在的 msgid: {msgid}\"\n    return \"\"\n\ndef _check_fact_list(facts,\
          \ allowed_msgids, target_msgids, allowed_fact_ids, conversation_no, retry_template, userid):\n    if not isinstance(facts,\
          \ list):\n        return \"updated_profile.facts 必须是数组\"\n    for i, fact in enumerate(facts):\n        if not isinstance(fact,\
          \ dict):\n            return f\"updated_profile.facts[{i}] 必须是对象\"\n        fact_id = fact.get(\"fact_id\")\n  \
          \      if fact_id not in (None, \"\") and fact_id not in allowed_fact_ids:\n            return f\"updated_profile.facts[{i}].fact_id\
          \ 不在 current_profile.facts 中\"\n        evidence_msgids = fact.get(\"evidence_msgids\")\n        err = _check_msgids(evidence_msgids,\
          \ allowed_msgids, f\"updated_profile.facts[{i}].evidence_msgids\", retry_template, userid, conversation_no)\n  \
          \      if err:\n            return err\n        convs = fact.get(\"evidence_conversation_nos\")\n        if not\
          \ isinstance(convs, list) or any(c != conversation_no for c in convs):\n            return f\"updated_profile.facts[{i}].evidence_conversation_nos\
          \ 必须只包含输入 conversation_no\"\n        source = fact.get(\"source\")\n        if source not in (\"direct\", \"context_inferred\"\
          ):\n            return f\"updated_profile.facts[{i}].source 必须是 direct 或 context_inferred\"\n        if source ==\
          \ \"direct\" and not any(msgid in target_msgids for msgid in evidence_msgids):\n            return f\"updated_profile.facts[{i}]\
          \ source=direct 时必须包含目标用户自己的证据消息\"\n        confidence = _num(fact.get(\"confidence\"))\n        if confidence is\
          \ None:\n            return f\"updated_profile.facts[{i}].confidence 必须是数字\"\n    return \"\"\n\ndef main(llm_text:\
          \ str, userid: str, conversation_no: str, valid_msgids: list, target_msgids: list, valid_fact_ids: list, retry_template:\
          \ str) -> dict:\n    data, parse_error = _parse(llm_text)\n    if not isinstance(data, dict):\n        return _invalid(parse_error\
          \ or \"模型输出不是 JSON 对象\", userid, conversation_no, retry_template)\n    if data.get(\"userid\") != userid:\n    \
          \    return _invalid(\"output.userid 必须等于输入 userid\", userid, conversation_no, retry_template)\n    if data.get(\"\
          profile_action\") not in (\"create\", \"update\", \"no_change\"):\n        return _invalid(\"profile_action 必须是\
          \ create、update 或 no_change\", userid, conversation_no, retry_template)\n    updated_profile = data.get(\"updated_profile\"\
          )\n    changes = data.get(\"changes\")\n    evidence = data.get(\"evidence\")\n    confidence = _num(data.get(\"\
          confidence\"))\n    if not isinstance(updated_profile, dict):\n        return _invalid(\"updated_profile 必须是对象\"\
          , userid, conversation_no, retry_template)\n    if not isinstance(changes, dict):\n        return _invalid(\"changes\
          \ 必须是对象\", userid, conversation_no, retry_template)\n    if not isinstance(evidence, dict):\n        return _invalid(\"\
          evidence 必须是对象\", userid, conversation_no, retry_template)\n    if confidence is None:\n        return _invalid(\"\
          confidence 必须是 0 到 1 的数字\", userid, conversation_no, retry_template)\n    if evidence.get(\"conversation_no\") !=\
          \ conversation_no:\n        return _invalid(\"evidence.conversation_no 必须等于输入 conversation_no\", userid, conversation_no,\
          \ retry_template)\n    allowed_msgids = set(valid_msgids or [])\n    target_set = set(target_msgids or [])\n   \
          \ allowed_fact_ids = set(valid_fact_ids or [])\n    err = _check_msgids(evidence.get(\"msgids\"), allowed_msgids,\
          \ \"evidence.msgids\", retry_template, userid, conversation_no)\n    if err:\n        return _invalid(err, userid,\
          \ conversation_no, retry_template)\n    err = _check_fact_list(updated_profile.get(\"facts\"), allowed_msgids, target_set,\
          \ allowed_fact_ids, conversation_no, retry_template, userid)\n    if err:\n        return _invalid(err, userid,\
          \ conversation_no, retry_template)\n    for field in (\"facts_updated\", \"facts_retired\"):\n        for i, item\
          \ in enumerate(_list(changes.get(field))):\n            if not isinstance(item, dict):\n                return _invalid(f\"\
          changes.{field}[{i}] 必须是对象\", userid, conversation_no, retry_template)\n            fact_id = item.get(\"fact_id\"\
          )\n            if fact_id not in allowed_fact_ids:\n                return _invalid(f\"changes.{field}[{i}].fact_id\
          \ 不在 current_profile.facts 中\", userid, conversation_no, retry_template)\n    return {\n        \"userid\": userid,\n\
          \        \"profile_action\": data[\"profile_action\"],\n        \"updated_profile\": updated_profile,\n        \"\
          changes\": changes,\n        \"evidence\": evidence,\n        \"confidence\": confidence,\n        \"is_valid\"\
          : True,\n        \"error_reason\": \"\",\n        \"retry_template\": retry_template,\n        \"raw_output\": llm_text\
          \ or \"\",\n    }"
