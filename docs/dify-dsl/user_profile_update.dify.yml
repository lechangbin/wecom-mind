        title: 代码：校验第 3 次并生成最终画像结果
        desc: 校验最后一次模型输出；仍失败时输出 no_change，避免 Dify 返回非法 JSON。
        code_language: python3
        variables:
        - variable: llm_text
          value_selector:
          - '1764811004501'
          - text
