        code: "import json\nimport re\n\ndef _parse(text):\n    if not isinstance(text, str):\n        return None, \"模型输出不是字符串\"\
          \n    raw = text.strip()\n    if raw.startswith(\"```\"):\n        raw = re.sub(r\"^```(?:json)?\\s*\", \"\", raw)\n\
          \        raw = re.sub(r\"\\s*```$\", \"\", raw)\n    try:\n        return json.loads(raw), \"\"\n    except Exception\
          \ as first_error:\n        match = re.search(r\"\\{.*\\}\", raw, re.S)\n        if not match:\n            return\
          \ None, f\"未找到 JSON 对象：{first_error}\"\n        try:\n            return json.loads(match.group(0)), \"\"\n    \
          \    except Exception as second_error:\n            return None, f\"JSON 解析失败：{second_error}\"\n\ndef _num(value):\n\
          \    if isinstance(value, bool):\n        return None\n    try:\n        number = float(value)\n    except Exception:\n\
          \        return None\n    return max(0.0, min(1.0, number))\n\ndef _fallback(userid, conversation_no):\n    return\
          \ {\n        \"userid\": userid,\n        \"profile_action\": \"no_change\",\n        \"updated_profile\": {\"summary\"\
          : \"\", \"facts\": []},\n        \"changes\": {\"facts_added\": [], \"facts_updated\": [], \"facts_retired\": []},\n\
          \        \"evidence\": {\"conversation_no\": conversation_no, \"msgids\": []},\n        \"confidence\": 0.0,\n \
          \   }\n\ndef _msgids_valid(values, allowed):\n    return isinstance(values, list) and all(isinstance(v, str) and\
          \ v in allowed for v in values)\n\ndef main(llm_text: str, userid: str, conversation_no: str, valid_msgids: list,\
          \ target_msgids: list, valid_fact_ids: list) -> dict:\n    data, _error = _parse(llm_text)\n    if not isinstance(data,\
          \ dict):\n        return _fallback(userid, conversation_no)\n    if data.get(\"userid\") != userid:\n        return\
          \ _fallback(userid, conversation_no)\n    if data.get(\"profile_action\") not in (\"create\", \"update\", \"no_change\"\
          ):\n        return _fallback(userid, conversation_no)\n    updated_profile = data.get(\"updated_profile\")\n   \
          \ changes = data.get(\"changes\")\n    evidence = data.get(\"evidence\")\n    confidence = _num(data.get(\"confidence\"\
          ))\n    if not isinstance(updated_profile, dict) or not isinstance(changes, dict) or not isinstance(evidence, dict)\
          \ or confidence is None:\n        return _fallback(userid, conversation_no)\n    if evidence.get(\"conversation_no\"\
          ) != conversation_no:\n        return _fallback(userid, conversation_no)\n    allowed = set(valid_msgids or [])\n\
          \    target = set(target_msgids or [])\n    facts_allowed = set(valid_fact_ids or [])\n    if not _msgids_valid(evidence.get(\"\
          msgids\"), allowed):\n        return _fallback(userid, conversation_no)\n    facts = updated_profile.get(\"facts\"\
          )\n    if not isinstance(facts, list):\n        return _fallback(userid, conversation_no)\n    for fact in facts:\n\
          \        if not isinstance(fact, dict):\n            return _fallback(userid, conversation_no)\n        fact_id\
          \ = fact.get(\"fact_id\")\n        if fact_id not in (None, \"\") and fact_id not in facts_allowed:\n          \
          \  return _fallback(userid, conversation_no)\n        evidence_msgids = fact.get(\"evidence_msgids\")\n        if\
          \ not _msgids_valid(evidence_msgids, allowed):\n            return _fallback(userid, conversation_no)\n        convs\
          \ = fact.get(\"evidence_conversation_nos\")\n        if not isinstance(convs, list) or any(c != conversation_no\
          \ for c in convs):\n            return _fallback(userid, conversation_no)\n        source = fact.get(\"source\"\
          )\n        if source not in (\"direct\", \"context_inferred\"):\n            return _fallback(userid, conversation_no)\n\
          \        if source == \"direct\" and not any(msgid in target for msgid in evidence_msgids):\n            return\
          \ _fallback(userid, conversation_no)\n    return {\n        \"userid\": userid,\n        \"profile_action\": data[\"\
          profile_action\"],\n        \"updated_profile\": updated_profile,\n        \"changes\": changes,\n        \"evidence\"\
          : evidence,\n        \"confidence\": confidence,\n    }"
