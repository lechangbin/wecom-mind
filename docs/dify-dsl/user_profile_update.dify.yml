    - id: '1764811002001'
      type: custom
      position:
        x: 380
        y: 282
      positionAbsolute:
        x: 380
        y: 282
      width: 244
      height: 140
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 代码：提取画像上下文
        desc: 提取目标用户、会话、消息和原画像，生成 msgid 与 fact_id 白名单；输入无效时输出 no_change 标准结构。
        code_language: python3
        variables:
        - variable: payload
          value_selector:
          - '1764811001001'
          - payload
          value_type: object
        code: "import json\n\nRETRY_TEMPLATE = json.dumps({\n    \"userid\": \"必须等于输入 userid\",\n    \"profile_action\": \"\
          create 或 update 或 no_change\",\n    \"updated_profile\": {\"summary\": \"\", \"facts\": []},\n    \"changes\": {\"\
          facts_added\": [], \"facts_updated\": [], \"facts_retired\": []},\n    \"evidence\": {\"conversation_no\": \"\"\
          , \"msgids\": []},\n    \"confidence\": 0.0\n}, ensure_ascii=False, indent=2)\n\ndef _as_dict(value):\n    if isinstance(value,\
          \ dict):\n        return value\n    if isinstance(value, str):\n        try:\n            parsed = json.loads(value)\n\
          \            return parsed if isinstance(parsed, dict) else {}\n        except Exception:\n            return {}\n\
          \    return {}\n\ndef _safe_list(value):\n    return value if isinstance(value, list) else []\n\ndef _text(value):\n\
          \    return value.strip() if isinstance(value, str) and value.strip() else \"\"\n\ndef _fact_id(fact):\n    obj\
          \ = _as_dict(fact)\n    return _text(obj.get(\"fact_id\") or obj.get(\"id\"))\n\ndef _no_change(userid, conversation_no,\
          \ reason):\n    return {\n        \"input_valid\": False,\n        \"userid\": userid,\n        \"profile_action\"\
          : \"no_change\",\n        \"updated_profile\": {\"summary\": \"\", \"facts\": []},\n        \"changes\": {\"facts_added\"\
          : [], \"facts_updated\": [], \"facts_retired\": []},\n        \"evidence\": {\"conversation_no\": conversation_no,\
          \ \"msgids\": []},\n        \"confidence\": 0.0,\n        \"context_json\": \"{}\",\n        \"valid_msgids\": [],\n\
          \        \"target_msgids\": [],\n        \"valid_fact_ids\": [],\n        \"conversation_no\": conversation_no,\n\
          \        \"error_reason\": reason,\n        \"retry_template\": RETRY_TEMPLATE,\n    }\n\ndef main(payload: dict)\
          \ -> dict:\n    data = _as_dict(payload)\n    userid = _text(data.get(\"userid\"))\n    conversation = _as_dict(data.get(\"\
          conversation\"))\n    conversation_no = _text(conversation.get(\"conversation_no\"))\n    messages = _safe_list(data.get(\"\
          messages\"))\n    target_messages = _safe_list(data.get(\"target_user_messages\"))\n    current_profile = _as_dict(data.get(\"\
          current_profile\"))\n    if not userid:\n        return _no_change(\"\", conversation_no, \"payload.userid 缺失\"\
          )\n    if not conversation_no:\n        return _no_change(userid, \"\", \"conversation.conversation_no 缺失\")\n\n\
          \    normalized_messages = []\n    valid_msgids = []\n    for index, item in enumerate(messages):\n        msg =\
          \ _as_dict(item)\n        msgid = _text(msg.get(\"msgid\"))\n        if not msgid:\n            return _no_change(userid,\
          \ conversation_no, f\"messages[{index}].msgid 缺失\")\n        valid_msgids.append(msgid)\n        normalized_messages.append({\n\
          \            \"message_id\": str(msg.get(\"message_id\") or \"\"),\n            \"msgid\": msgid,\n            \"\
          chatid\": _text(msg.get(\"chatid\")),\n            \"userid\": _text(msg.get(\"userid\")),\n            \"sender_type\"\
          : _text(msg.get(\"sender_type\") or \"user\"),\n            \"bot_role\": msg.get(\"bot_role\"),\n            \"\
          msgtype\": _text(msg.get(\"msgtype\") or \"text\"),\n            \"content\": _text(msg.get(\"content\") or msg.get(\"\
          content_text\")),\n            \"quote_msgid\": msg.get(\"quote_msgid\"),\n            \"mentioned_bot\": bool(msg.get(\"\
          mentioned_bot\")),\n            \"create_time\": _text(msg.get(\"create_time\")),\n        })\n\n    target_msgids\
          \ = []\n    for item in target_messages:\n        msgid = _text(_as_dict(item).get(\"msgid\"))\n        if msgid:\n\
          \            target_msgids.append(msgid)\n\n    current_facts = _safe_list(current_profile.get(\"facts\"))\n   \
          \ valid_fact_ids = [fact_id for fact_id in (_fact_id(f) for f in current_facts) if fact_id]\n    context = {\n \
          \       \"userid\": userid,\n        \"conversation\": conversation,\n        \"messages\": normalized_messages,\n\
          \        \"target_user_messages\": target_messages,\n        \"current_profile\": current_profile,\n        \"policy\"\
          : {\n            \"target_userid_only\": True,\n            \"prefer_direct_evidence_from_target_user\": True,\n\
          \            \"context_inferred_requires_lower_confidence\": True,\n            \"do_not_invent_userid_msgid_conversation_no_or_fact_id\"\
          : True\n        }\n    }\n    return {\n        \"input_valid\": True,\n        \"userid\": userid,\n        \"\
          profile_action\": \"no_change\",\n        \"updated_profile\": {\"summary\": current_profile.get(\"summary\") or\
          \ \"\", \"facts\": current_facts},\n        \"changes\": {\"facts_added\": [], \"facts_updated\": [], \"facts_retired\"\
          : []},\n        \"evidence\": {\"conversation_no\": conversation_no, \"msgids\": []},\n        \"confidence\": 0.0,\n\
          \        \"context_json\": json.dumps(context, ensure_ascii=False, separators=(\",\", \":\")),\n        \"valid_msgids\"\
          : valid_msgids,\n        \"target_msgids\": target_msgids,\n        \"valid_fact_ids\": valid_fact_ids,\n      \
          \  \"conversation_no\": conversation_no,\n        \"error_reason\": \"\",\n        \"retry_template\": RETRY_TEMPLATE,\n\
          \    }\n"
        outputs:
          input_valid:
            type: boolean
            children: null
          userid:
            type: string
            children: null
          profile_action:
            type: string
            children: null
          updated_profile:
            type: object
            children: null
          changes:
            type: object
            children: null
          evidence:
