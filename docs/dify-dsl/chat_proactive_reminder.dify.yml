    - id: '1764051004001'
      type: custom
      position:
        x: 1280
        y: 140
      positionAbsolute:
        x: 1280
        y: 140
      width: 244
      height: 128
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 代码：校验第 1 次主动回复 JSON
        desc: 解析第 1 次模型输出，校验 JSON schema、userid 和 msgid 白名单；失败时输出错误原因和重试模板。
        code_language: python3
        variables:
        - variable: llm_text
          value_selector:
          - '1764051003001'
          - text
          value_type: string
        - variable: candidate_userids
          value_selector:
          - '1764051002001'
          - candidate_userids
          value_type: array[string]
        - variable: known_msgids
          value_selector:
          - '1764051002001'
          - known_msgids
          value_type: array[string]
        code: |-
          import json
          import re

          RETRY_TEMPLATE = json.dumps({
              "should_send": False,
              "target_userids": [],
              "quote_msgid": "",
              "content": "",
              "confidence": 0.0
          }, ensure_ascii=False, indent=2)

          def _raw_json(text):
              if not isinstance(text, str):
                  return None, "模型输出不是字符串"
              raw = text.strip()
              if raw.startswith("```"):
                  raw = re.sub(r"^```(?:json)?\s*", "", raw)
                  raw = re.sub(r"\s*```$", "", raw)
              try:
                  value = json.loads(raw)
                  return value, ""
              except Exception as first_error:
                  match = re.search(r"\{.*\}", raw, re.S)
                  if not match:
                      return None, f"未找到 JSON 对象：{first_error}"
                  try:
                      value = json.loads(match.group(0))
                      return value, ""
                  except Exception as second_error:
                      return None, f"JSON 解析失败：{second_error}"

          def _confidence(value):
              if isinstance(value, bool):
                  return None
              try:
                  number = float(value)
              except Exception:
                  return None
              return max(0.0, min(1.0, number))

          def _as_string_list(value):
              if not isinstance(value, list):
                  return None
              result = []
              for item in value:
                  if not isinstance(item, str):
                      return None
                  text = item.strip()
                  if text:
                      result.append(text)
              return result

          def _invalid(reason):
              return {
                  "should_send": False,
                  "target_userids": [],
                  "quote_msgid": "",
                  "content": "",
                  "confidence": 0.0,
                  "is_valid": False,
                  "error_reason": reason,
                  "retry_template": RETRY_TEMPLATE,
              }

          def main(llm_text: str, candidate_userids: list, known_msgids: list) -> dict:
              allowed_users = set(_as_string_list(candidate_userids) or [])
              allowed_msgids = set(_as_string_list(known_msgids) or [])

              data, parse_error = _raw_json(llm_text)
              if not isinstance(data, dict):
                  return _invalid(parse_error or "模型输出不是 JSON 对象")

              if not isinstance(data.get("should_send"), bool):
                  return _invalid("should_send 必须是布尔值 true 或 false")
              target_userids = _as_string_list(data.get("target_userids"))
              if target_userids is None:
                  return _invalid("target_userids 必须是字符串数组")
              quote_msgid = data.get("quote_msgid")
              if not isinstance(quote_msgid, str):
                  return _invalid("quote_msgid 必须是字符串")
              content = data.get("content")
              if not isinstance(content, str):
                  return _invalid("content 必须是字符串")
              confidence = _confidence(data.get("confidence"))
              if confidence is None:
                  return _invalid("confidence 必须是 0 到 1 的数字")

              should_send = data["should_send"]
              quote_msgid = quote_msgid.strip()
              content = content.strip()

              if not should_send:
                  if target_userids or quote_msgid or content:
                      return _invalid("should_send=false 时 target_userids、quote_msgid、content 必须为空")
                  return {
                      "should_send": False,
                      "target_userids": [],
                      "quote_msgid": "",
                      "content": "",
                      "confidence": confidence,
                      "is_valid": True,
                      "error_reason": "",
                      "retry_template": RETRY_TEMPLATE,
                  }

              illegal_users = [userid for userid in target_userids if userid not in allowed_users]
              if illegal_users:
                  return _invalid("target_userids 包含输入中不存在的 userid: " + ",".join(illegal_users))
              if not target_userids:
                  return _invalid("should_send=true 时 target_userids 不能为空")
              if quote_msgid not in allowed_msgids:
                  return _invalid("quote_msgid 必须来自输入中的 known_msgids")
              if not content:
                  return _invalid("should_send=true 时 content 不能为空")
              if confidence < 0.6:
                  return _invalid("should_send=true 时 confidence 必须大于等于 0.6；否则请输出 should_send=false")

              return {
                  "should_send": True,
                  "target_userids": target_userids,
                  "quote_msgid": quote_msgid,
                  "content": content,
                  "confidence": confidence,
                  "is_valid": True,
                  "error_reason": "",
                  "retry_template": RETRY_TEMPLATE,
              }
        outputs:
          should_send:
            type: boolean
            children: null
          target_userids:
            type: array[string]
            children: null
          quote_msgid:
            type: string
            children: null
          content:
            type: string
            children: null
          confidence:
            type: number
            children: null
          is_valid:
            type: boolean
            children: null
          error_reason:
            type: string
            children: null
          retry_template:
            type: string
            children: null
