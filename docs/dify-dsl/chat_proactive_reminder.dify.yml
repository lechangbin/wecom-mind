                  if target_userids or quote_msgid or content:
                      return _invalid("should_send=false 时 target_userids、quote_msgid、content 必须为空")
                  return {
                      "should_send": False,
                      "target_userids": [],
                      "quote_msgid": "",
                      "content": "",
                      "confidence": confidence,
                      "is_valid": True,
                      "error_reason": "",
                      "retry_template": RETRY_TEMPLATE,
                  }

              illegal_users = [userid for userid in target_userids if userid not in allowed_users]
              if illegal_users:
                  return _invalid("target_userids 包含输入中不存在的 userid: " + ",".join(illegal_users))
              if not target_userids:
                  return _invalid("should_send=true 时 target_userids 不能为空")
              if quote_msgid not in allowed_msgids:
                  return _invalid("quote_msgid 必须来自输入中的 known_msgids")
              if not content:
                  return _invalid("should_send=true 时 content 不能为空")
              if confidence < 0.6:
                  return _invalid("should_send=true 时 confidence 必须大于等于 0.6；否则请输出 should_send=false")

              return {
                  "should_send": True,
                  "target_userids": target_userids,
                  "quote_msgid": quote_msgid,
                  "content": content,
                  "confidence": confidence,
                  "is_valid": True,
                  "error_reason": "",
                  "retry_template": RETRY_TEMPLATE,
              }
