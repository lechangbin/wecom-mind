    - id: '1764051002001'
      type: custom
      position:
        x: 380
        y: 282
      positionAbsolute:
        x: 380
        y: 282
      width: 244
      height: 120
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 代码：整理意图答疑上下文
        desc: 从 payload 中整理触发问题、消息窗口、候选用户和可引用 msgid，输出知识库检索 query 与 LLM 上下文；不新增用户或消息。
        code_language: python3
        variables:
        - variable: payload
          value_selector:
          - '1764051001001'
          - payload
          value_type: object
        code: |
          import json

          def _as_dict(value):
              if isinstance(value, dict):
                  return value
              if isinstance(value, str):
                  try:
                      parsed = json.loads(value)
                      return parsed if isinstance(parsed, dict) else {}
                  except Exception:
                      return {}
              return {}

          def _safe_list(value):
              return value if isinstance(value, list) else []

          def _text(value):
              return value.strip() if isinstance(value, str) and value.strip() else ""

          def _collect_userid(item):
              obj = _as_dict(item)
              for key in ("userid", "user_id", "sender_userid", "from_userid", "member_userid"):
                  value = _text(obj.get(key))
                  if value:
                      return value
              return ""

          def _collect_msgid(item):
              obj = _as_dict(item)
              for key in ("msgid", "msg_id", "message_id"):
                  value = _text(obj.get(key))
                  if value:
                      return value
              return ""

          def main(payload: dict) -> dict:
              data = _as_dict(payload)
              trigger = _as_dict(data.get("message") or data.get("trigger_message") or data.get("trigger"))
              messages = _safe_list(data.get("messages") or data.get("recent_messages") or data.get("chat_window"))
              members = _safe_list(data.get("members") or data.get("group_members"))
              handled_records = _safe_list(data.get("handled_records") or data.get("processed_records") or data.get("reminder_records"))
              query = _text(
                  data.get("question")
                  or data.get("query")
                  or data.get("intent_query")
                  or data.get("content")
                  or trigger.get("content")
                  or trigger.get("text")
              )

              candidate_userids = set()
              for source in (members, messages, _safe_list(data.get("target_userids"))):
                  for item in source:
                      value = _collect_userid(item) if isinstance(item, dict) else _text(item)
                      if value:
                          candidate_userids.add(value)

              known_msgids = set()
              for item in messages:
                  value = _collect_msgid(item)
                  if value:
                      known_msgids.add(value)

              context = {
                  "chatid": _text(data.get("chatid") or data.get("groupid")),
                  "scenario": _text(data.get("scenario") or data.get("scene")),
                  "intent_type": _text(data.get("intent_type") or data.get("intent")),
                  "question": query,
                  "trigger_message": trigger,
                  "messages": messages,
                  "members": members,
                  "handled_records": handled_records,
                  "candidate_userids": sorted(candidate_userids),
                  "known_msgids": sorted(known_msgids),
                  "policy": {
                      "do_not_repeat_handled_records": True,
                      "target_userids_must_come_from_candidate_userids": True,
                      "quote_msgid_must_come_from_known_msgids": True,
                      "reply_style": "intent_triggered_guess_answer"
                  }
              }

              return {
                  "query": query,
                  "context_json": json.dumps(context, ensure_ascii=False, separators=(",", ":")),
                  "candidate_userids": sorted(candidate_userids),
                  "known_msgids": sorted(known_msgids),
              }
        outputs:
          query:
            type: string
            children: null
          context_json:
            type: string
            children: null
          candidate_userids:
            type: array[string]
            children: null
          known_msgids:
            type: array[string]
            children: null
