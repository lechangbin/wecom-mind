        desc: 接收自建系统通过 /v1/workflows/run 传入的 payload；本节点只声明一个 json_object 入参，不做业务判断。
        variables:
        - variable: payload
          label: 系统上下文 payload
          type: json_object
          required: true
          hint: 由自建系统组装，包含触发消息、群上下文、用户画像摘要、轻量图像信息等。
    - id: '1764050002001'
      type: custom
      position:
        x: 380
        y: 282
      positionAbsolute:
        x: 380
        y: 282
      width: 244
      height: 120
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 代码：提取答疑上下文
        desc: 从 payload 中提取问题文本、触发消息和群上下文，生成知识库检索 query 与给 LLM 使用的压缩上下文；不编造 msgid 或 userid。
        code_language: python3
        variables:
        - variable: payload
          value_selector:
          - '1764050001001'
          - payload
          value_type: object
        code: |
          import json

          def _as_dict(value):
              if isinstance(value, dict):
                  return value
              if isinstance(value, str):
                  try:
                      parsed = json.loads(value)
                      return parsed if isinstance(parsed, dict) else {}
                  except Exception:
                      return {}
              return {}

          def _safe_list(value):
              return value if isinstance(value, list) else []

          def _text(*values):
              for value in values:
                  if isinstance(value, str) and value.strip():
                      return value.strip()
              return ""

          def _reply_profile_context(data, profile):
              explicit = _as_dict(data.get("reply_profile_context") or data.get("profile_context") or {})
              if explicit:
                  return explicit

              facts = _safe_list(profile.get("facts"))
              return {
                  "summary": _text(profile.get("summary")),
                  "communication_style": _as_dict(profile.get("communication_style") or profile.get("style") or {}),
                  "stable_preferences": _safe_list(profile.get("stable_preferences") or profile.get("preferences")),
                  "recent_focus": _safe_list(profile.get("recent_focus") or profile.get("focus")),
                  "facts": facts[:8],
                  "usage_policy": {
                      "use_as_writing_style_only": True,
                      "do_not_use_as_factual_evidence": True,
                      "do_not_reveal_profile_source": True,
                      "prefer_current_message_and_knowledge": True
                  }
              }

          def main(payload: dict) -> dict:
              data = _as_dict(payload)
              message = _as_dict(data.get("message") or data.get("trigger_message") or data.get("trigger"))
              group = _as_dict(data.get("group") or data.get("chat") or {})
              profile = _as_dict(data.get("user_profile") or data.get("profile") or {})
              reply_profile_context = _reply_profile_context(data, profile)
              query = _text(
                  data.get("question"),
                  data.get("query"),
                  data.get("content"),
                  message.get("content"),
                  message.get("text"),
              )
              trigger_msgid = _text(data.get("trigger_msgid"), message.get("msgid"))
              context = {
                  "trigger_msgid": trigger_msgid,
                  "trigger_userid": _text(data.get("userid"), message.get("userid"), message.get("sender_userid")),
                  "groupid": _text(data.get("groupid"), group.get("groupid"), group.get("chatid")),
                  "question": query,
                  "trigger_message": message,
                  "recent_messages": _safe_list(data.get("recent_messages") or data.get("messages")),
                  "user_profile": profile,
                  "reply_profile_context": reply_profile_context,
                  "image_summaries": _safe_list(data.get("image_summaries") or data.get("light_images") or data.get("images")),
              }
              return {
                  "query": query,
                  "context_json": json.dumps(context, ensure_ascii=False, separators=(",", ":")),
              }
        outputs:
          query:
            type: string
            children: null
          context_json:
            type: string
            children: null
