      positionAbsolute:
        x: 1280
        y: 140
      width: 244
      height: 128
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 代码：校验第 1 次答疑 JSON
        desc: 解析第 1 次模型输出，校验 JSON schema；失败时输出错误原因和重试模板，供下一轮生成修正。
        code_language: python3
        variables:
        - variable: llm_text
          value_selector:
          - '1764050004001'
          - text
          value_type: string
        - variable: query
          value_selector:
          - '1764050002001'
          - query
          value_type: string
        code: |-
          import json
          import re

          RETRY_TEMPLATE = json.dumps({
              "action": "reply 或 out_of_scope",
              "content": "reply 时填写 Markdown 答案；out_of_scope 时必须为空字符串",
              "reason": "简短说明，不要编造输入中不存在的信息",
              "confidence": 0.0
          }, ensure_ascii=False, indent=2)

          def _raw_json(text):
              if not isinstance(text, str):
                  return None, "模型输出不是字符串"
              raw = text.strip()
              if raw.startswith("```"):
                  raw = re.sub(r"^```(?:json)?\s*", "", raw)
                  raw = re.sub(r"\s*```$", "", raw)
              try:
                  value = json.loads(raw)
                  return value, ""
              except Exception as first_error:
                  match = re.search(r"\{.*\}", raw, re.S)
                  if not match:
                      return None, f"未找到 JSON 对象：{first_error}"
                  try:
                      value = json.loads(match.group(0))
                      return value, ""
                  except Exception as second_error:
                      return None, f"JSON 解析失败：{second_error}"

          def _num(value):
              if isinstance(value, bool):
                  return None
              try:
                  number = float(value)
              except Exception:
                  return None
              return max(0.0, min(1.0, number))

          def _invalid(reason):
              return {
                  "action": "out_of_scope",
                  "content": "",
                  "reason": reason,
                  "confidence": 0.0,
                  "is_valid": False,
                  "error_reason": reason,
                  "retry_template": RETRY_TEMPLATE,
              }

          def main(llm_text: str, query: str) -> dict:
              if not isinstance(query, str) or not query.strip():
                  return {
                      "action": "out_of_scope",
                      "content": "",
                      "reason": "输入中没有可用于答疑的问题文本",
                      "confidence": 0.0,
                      "is_valid": True,
                      "error_reason": "",
                      "retry_template": RETRY_TEMPLATE,
                  }

              data, parse_error = _raw_json(llm_text)
              if not isinstance(data, dict):
                  return _invalid(parse_error or "模型输出不是 JSON 对象")

              action = data.get("action")
              content = data.get("content")
              reason = data.get("reason")
              confidence = _num(data.get("confidence"))

              if action not in ("reply", "out_of_scope"):
                  return _invalid("action 必须是 reply 或 out_of_scope")
              if not isinstance(content, str):
                  return _invalid("content 必须是字符串")
              if not isinstance(reason, str):
                  return _invalid("reason 必须是字符串")
              if confidence is None:
                  return _invalid("confidence 必须是 0 到 1 的数字")
              if action == "reply" and not content.strip():
                  return _invalid("action=reply 时 content 不能为空")
              if action == "out_of_scope" and content.strip():
                  return _invalid("action=out_of_scope 时 content 必须为空字符串")

              return {
                  "action": action,
                  "content": content.strip(),
                  "reason": reason.strip(),
                  "confidence": confidence,
                  "is_valid": True,
                  "error_reason": "",
                  "retry_template": RETRY_TEMPLATE,
              }
        outputs:
          action:
            type: string
            children: null
          content:
            type: string
            children: null
          reason:
            type: string
            children: null
          confidence:
            type: number
            children: null
          is_valid:
            type: boolean
            children: null
          error_reason:
            type: string
            children: null
          retry_template:
            type: string
            children: null
