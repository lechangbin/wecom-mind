      data:
        type: start
        title: 开始：接收每日消息 payload
        desc: 接收自建系统传入的单日全量群消息、用户信息和运行窗口；本节点只声明 payload，不做切分判断。
        variables:
        - variable: payload
          label: 每日会话切分 payload
          type: json_object
          required: true
          hint: 包含 chat、window、messages、users、existing_segments、runtime。
    - id: '1764810002001'
      type: custom
      position:
        x: 380
        y: 282
      positionAbsolute:
        x: 380
        y: 282
      width: 244
      height: 140
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 代码：提取并校验消息窗口
        desc: 从 payload 中提取单日消息、用户和窗口信息，生成压缩上下文、msgid 白名单和相邻消息对；输入无效时直接输出 failed 标准结构。
        code_language: python3
        variables:
        - variable: payload
          value_selector:
          - '1764810001001'
          - payload
          value_type: object
        code: "import json\n\nRETRY_TEMPLATE = json.dumps({\n    \"status\": \"success 或 failed\",\n    \"split_positions\"\
          : [\n        {\n            \"after_msgid\": \"输入中存在且与 before_msgid 相邻的 msgid\",\n            \"before_msgid\":\
          \ \"输入中存在且紧跟 after_msgid 的 msgid\",\n            \"reason_type\": \"time_gap 或 intent_shift 或 topic_shift 或 task_closed\
          \ 或 manual_hint 或 other\",\n            \"reason\": \"切分原因\",\n            \"confidence\": 0.0\n        }\n    ],\n\
          \    \"confidence\": 0.0,\n    \"error\": None\n}, ensure_ascii=False, indent=2)\n\ndef _as_dict(value):\n    if\
          \ isinstance(value, dict):\n        return value\n    if isinstance(value, str):\n        try:\n            parsed\
          \ = json.loads(value)\n            return parsed if isinstance(parsed, dict) else {}\n        except Exception:\n\
          \            return {}\n    return {}\n\ndef _safe_list(value):\n    return value if isinstance(value, list) else\
          \ []\n\ndef _text(value):\n    return value.strip() if isinstance(value, str) and value.strip() else \"\"\n\ndef\
          \ _failed(reason):\n    return {\n        \"input_valid\": False,\n        \"status\": \"failed\",\n        \"split_positions\"\
          : [],\n        \"confidence\": 0.0,\n        \"error\": {\"reason\": reason, \"last_error\": reason, \"attempts\"\
          : 0},\n        \"context_json\": \"{}\",\n        \"known_msgids\": [],\n        \"ordered_msgids\": [],\n     \
          \   \"adjacent_map\": {},\n        \"retry_template\": RETRY_TEMPLATE,\n    }\n\ndef main(payload: dict) -> dict:\n\
          \    data = _as_dict(payload)\n    chat = _as_dict(data.get(\"chat\"))\n    window = _as_dict(data.get(\"window\"\
          ))\n    messages = _safe_list(data.get(\"messages\"))\n    users = _safe_list(data.get(\"users\"))\n\n    normalized\
          \ = []\n    for index, item in enumerate(messages):\n        msg = _as_dict(item)\n        msgid = _text(msg.get(\"\
          msgid\"))\n        if not msgid:\n            return _failed(f\"messages[{index}].msgid 缺失\")\n        normalized.append({\n\
          \            \"index\": index,\n            \"message_id\": str(msg.get(\"message_id\") or \"\"),\n            \"\
          msgid\": msgid,\n            \"userid\": _text(msg.get(\"userid\")),\n            \"sender_type\": _text(msg.get(\"\
          sender_type\") or \"user\"),\n            \"bot_role\": msg.get(\"bot_role\"),\n            \"msgtype\": _text(msg.get(\"\
          msgtype\") or \"text\"),\n            \"content\": _text(msg.get(\"content\") or msg.get(\"content_text\")),\n \
          \           \"quote_msgid\": msg.get(\"quote_msgid\"),\n            \"mentioned_bot\": bool(msg.get(\"mentioned_bot\"\
          )),\n            \"mentioned_users\": _safe_list(msg.get(\"mentioned_users\")),\n            \"create_time\": _text(msg.get(\"\
          create_time\")),\n        })\n\n    if len(normalized) < 2:\n        return {\n            \"input_valid\": False,\n\
          \            \"status\": \"success\",\n            \"split_positions\": [],\n            \"confidence\": 1.0,\n\
          \            \"error\": None,\n            \"context_json\": json.dumps({\n                \"chat\": chat,\n   \
          \             \"window\": window,\n                \"messages\": normalized,\n                \"users\": users,\n\
          \                \"policy\": \"消息少于 2 条，无需切分。\"\n            }, ensure_ascii=False, separators=(\",\", \":\")),\n\
          \            \"known_msgids\": [m[\"msgid\"] for m in normalized],\n            \"ordered_msgids\": [m[\"msgid\"\
          ] for m in normalized],\n            \"adjacent_map\": {},\n            \"retry_template\": RETRY_TEMPLATE,\n  \
          \      }\n\n    ordered_msgids = [m[\"msgid\"] for m in normalized]\n    adjacent_map = {\n        ordered_msgids[i]:\
          \ ordered_msgids[i + 1]\n        for i in range(len(ordered_msgids) - 1)\n    }\n    context = {\n        \"chat\"\
          : chat,\n        \"window\": window,\n        \"messages\": normalized,\n        \"users\": users,\n        \"existing_segments\"\
          : _safe_list(data.get(\"existing_segments\")),\n        \"rules\": [\n            \"时间间隔显著变长时可以切分，但不能只凭时间切分。\",\n\
          \            \"意图、主题、任务目标明显变化时可以切分。\",\n            \"机器人回复通常跟随前一条用户问题，不单独形成新会话。\",\n            \"quote_msgid 指向前文时优先保持同一会话。\"\
          ,\n            \"短确认、表情、收到等噪声不应单独触发切分。\",\n            \"只能输出输入中存在且相邻的 msgid 作为切分点。\"\n        ]\n    }\n    return\
          \ {\n        \"input_valid\": True,\n        \"status\": \"success\",\n        \"split_positions\": [],\n      \
          \  \"confidence\": 0.0,\n        \"error\": None,\n        \"context_json\": json.dumps(context, ensure_ascii=False,\
          \ separators=(\",\", \":\")),\n        \"known_msgids\": ordered_msgids,\n        \"ordered_msgids\": ordered_msgids,\n\
          \        \"adjacent_map\": adjacent_map,\n        \"retry_template\": RETRY_TEMPLATE,\n    }\n"
        outputs:
          input_valid:
            type: boolean
            children: null
          status:
            type: string
            children: null
          split_positions:
            type: array[object]
            children: null
          confidence:
            type: number
            children: null
          error:
            type: object
            children: null
          context_json:
            type: string
            children: null
          known_msgids:
            type: array[string]
            children: null
          ordered_msgids:
            type: array[string]
            children: null
          adjacent_map:
            type: object
            children: null
          retry_template:
            type: string
            children: null
