    - id: '1764810003001'
      type: custom
      position:
        x: 980
        y: 120
      positionAbsolute:
        x: 980
        y: 120
      width: 244
      height: 132
      sourcePosition: right
      targetPosition: left
      data:
        type: llm
        title: 大模型：第 1 次生成切分点
        desc: 第 1 次尝试输出 split_positions；只判断切分位置，不生成 conversation_no，不写库。
        model:
          provider: langgenius/siliconflow/siliconflow
          name: Qwen/Qwen3-8B
          mode: chat
          completion_params:
            temperature: 0.1
            max_tokens: 1800
        prompt_template:
        - role: system
          text: "你是企业微信群每日会话切分 AI 节点，只负责输出会话切分位置，不负责写库、不负责生成 conversation_no、不负责摘要入库。\n\n必须只输出合法 JSON，不要在 JSON 外输出解释性自然语言。\n\
            \n输出结构：\n{\n  \"status\": \"success\",\n  \"split_positions\": [\n    {\n      \"after_msgid\": \"输入中存在的 msgid\"\
            ,\n      \"before_msgid\": \"输入中存在且紧跟 after_msgid 的 msgid\",\n      \"reason_type\": \"time_gap | intent_shift\
            \ | topic_shift | task_closed | manual_hint | other\",\n      \"reason\": \"切分原因\",\n      \"confidence\": 0 到\
            \ 1 的数字\n    }\n  ],\n  \"confidence\": 0 到 1 的数字,\n  \"error\": null\n}\n\n切分规则：\n- 时间间隔明显变长可以切分，但不能只凭时间切分。\n\
            - 意图从咨询、确认、安排、闲聊等明显变化时可以切分。\n- 业务对象、客户、问题域、任务目标变化时可以切分。\n- 一个问题已经得到回答、确认或形成后续动作后，后续新问题可以切分。\n- quote_msgid 指向前文时优先保持同一会话。\n\
            - 机器人回复通常跟随前一条用户问题，不应单独形成新会话。\n- 表情、确认收到、短回复不应单独触发切分。\n- 不要把每条消息都切成独立会话，也不要把明显跨多个主题的一整天消息合并成一个会话。\n- after_msgid\
            \ 和 before_msgid 必须来自输入，且必须是相邻消息。"
        - role: user
          text: '每日消息上下文 JSON：

            {{#1764810002001.context_json#}}'
        variables: []
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
    - id: '1764810004001'
      type: custom
      position:
        x: 1280
        y: 120
      positionAbsolute:
        x: 1280
        y: 120
      width: 244
      height: 128
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 代码：校验第 1 次切分 JSON
        desc: 解析第 1 次模型输出，校验 split_positions 是否引用输入中存在且相邻的 msgid；失败时生成修复提示变量。
        code_language: python3
        variables:
        - variable: llm_text
          value_selector:
          - '1764810003001'
          - text
          value_type: string
        - variable: ordered_msgids
          value_selector:
          - '1764810002001'
          - ordered_msgids
          value_type: array[string]
        - variable: adjacent_map
          value_selector:
          - '1764810002001'
          - adjacent_map
          value_type: object
        - variable: retry_template
          value_selector:
          - '1764810002001'
          - retry_template
          value_type: string
        code: "import json\nimport re\n\ndef _parse(text):\n    if not isinstance(text, str):\n        return None, \"模型输出不是字符串\"\
          \n    raw = text.strip()\n    if raw.startswith(\"```\"):\n        raw = re.sub(r\"^```(?:json)?\\s*\", \"\", raw)\n\
          \        raw = re.sub(r\"\\s*```$\", \"\", raw)\n    try:\n        return json.loads(raw), \"\"\n    except Exception\
          \ as first_error:\n        match = re.search(r\"\\{.*\\}\", raw, re.S)\n        if not match:\n            return\
          \ None, f\"未找到 JSON 对象：{first_error}\"\n        try:\n            return json.loads(match.group(0)), \"\"\n    \
          \    except Exception as second_error:\n            return None, f\"JSON 解析失败：{second_error}\"\n\ndef _num(value):\n\
          \    if isinstance(value, bool):\n        return None\n    try:\n        number = float(value)\n    except Exception:\n\
          \        return None\n    return max(0.0, min(1.0, number))\n\ndef _invalid(reason, retry_template):\n    return\
          \ {\n        \"status\": \"failed\",\n        \"split_positions\": [],\n        \"confidence\": 0.0,\n        \"\
          error\": {\"reason\": reason, \"last_error\": reason, \"attempts\": 0},\n        \"is_valid\": False,\n        \"\
          error_reason\": reason,\n        \"retry_template\": retry_template,\n        \"raw_output\": \"\",\n    }\n\ndef\
          \ main(llm_text: str, ordered_msgids: list, adjacent_map: dict, retry_template: str) -> dict:\n    data, parse_error\
          \ = _parse(llm_text)\n    if not isinstance(data, dict):\n        return _invalid(parse_error or \"模型输出不是 JSON 对象\"\
          , retry_template)\n\n    if data.get(\"status\") != \"success\":\n        return _invalid(\"status 必须是 success\"\
          , retry_template)\n    positions = data.get(\"split_positions\")\n    if not isinstance(positions, list):\n    \
          \    return _invalid(\"split_positions 必须是数组\", retry_template)\n    confidence = _num(data.get(\"confidence\"))\n\
          \    if confidence is None:\n        return _invalid(\"confidence 必须是 0 到 1 的数字\", retry_template)\n\n    allowed\
          \ = set(ordered_msgids or [])\n    seen = set()\n    validated = []\n    allowed_reason_types = {\"time_gap\", \"\
          intent_shift\", \"topic_shift\", \"task_closed\", \"manual_hint\", \"other\"}\n    for index, item in enumerate(positions):\n\
          \        if not isinstance(item, dict):\n            return _invalid(f\"split_positions[{index}] 必须是对象\", retry_template)\n\
          \        after = item.get(\"after_msgid\")\n        before = item.get(\"before_msgid\")\n        if not isinstance(after,\
          \ str) or after not in allowed:\n            return _invalid(f\"split_positions[{index}].after_msgid 不在输入消息中\",\
          \ retry_template)\n        if not isinstance(before, str) or before not in allowed:\n            return _invalid(f\"\
          split_positions[{index}].before_msgid 不在输入消息中\", retry_template)\n        if adjacent_map.get(after) != before:\n\
          \            return _invalid(f\"split_positions[{index}] 的 after_msgid 和 before_msgid 必须相邻\", retry_template)\n\
          \        pair_key = after + \"->\" + before\n        if pair_key in seen:\n            return _invalid(f\"split_positions[{index}]\
          \ 重复切分点\", retry_template)\n        seen.add(pair_key)\n        reason_type = item.get(\"reason_type\")\n      \
          \  if reason_type not in allowed_reason_types:\n            return _invalid(f\"split_positions[{index}].reason_type\
          \ 不合法\", retry_template)\n        reason = item.get(\"reason\")\n        if not isinstance(reason, str) or not reason.strip():\n\
          \            return _invalid(f\"split_positions[{index}].reason 不能为空\", retry_template)\n        item_confidence\
          \ = _num(item.get(\"confidence\"))\n        if item_confidence is None:\n            return _invalid(f\"split_positions[{index}].confidence\
          \ 必须是数字\", retry_template)\n        validated.append({\n            \"after_msgid\": after,\n            \"before_msgid\"\
          : before,\n            \"reason_type\": reason_type,\n            \"reason\": reason.strip(),\n            \"confidence\"\
          : item_confidence,\n        })\n\n    order = {msgid: i for i, msgid in enumerate(ordered_msgids or [])}\n    validated.sort(key=lambda\
          \ item: order.get(item[\"after_msgid\"], 0))\n    return {\n        \"status\": \"success\",\n        \"split_positions\"\
          : validated,\n        \"confidence\": confidence,\n        \"error\": None,\n        \"is_valid\": True,\n     \
          \   \"error_reason\": \"\",\n        \"retry_template\": retry_template,\n        \"raw_output\": llm_text or \"\
          \",\n    }"
        outputs:
          status:
            type: string
            children: null
          split_positions:
            type: array[object]
            children: null
          confidence:
            type: number
            children: null
          error:
            type: object
            children: null
          is_valid:
            type: boolean
            children: null
          error_reason:
            type: string
            children: null
          retry_template:
            type: string
            children: null
          raw_output:
            type: string
            children: null
